<!-- StartupHub App Icon - 1024x1024 -->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient Background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="rocketGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0E7FF;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="shine" cx="30%" cy="30%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <rect width="1024" height="1024" fill="url(#bgGradient)" rx="180"/>
  
  <!-- Rocket Icon -->
  <g transform="translate(512, 380)">
    <!-- Rocket body -->
    <ellipse cx="0" cy="0" rx="80" ry="140" fill="url(#rocketGradient)"/>
    
    <!-- Rocket tip -->
    <path d="M -50 -140 Q 0 -200 50 -140 Z" fill="#FFFFFF"/>
    
    <!-- Window -->
    <circle cx="0" cy="-40" r="35" fill="#6366F1" opacity="0.3"/>
    <circle cx="0" cy="-40" r="25" fill="#8B5CF6" opacity="0.5"/>
    
    <!-- Left wing -->
    <path d="M -80 60 L -140 140 L -80 120 Z" fill="#E0E7FF"/>
    <path d="M -80 60 L -140 140 L -80 120 Z" fill="#6366F1" opacity="0.2"/>
    
    <!-- Right wing -->
    <path d="M 80 60 L 140 140 L 80 120 Z" fill="#E0E7FF"/>
    <path d="M 80 60 L 140 140 L 80 120 Z" fill="#6366F1" opacity="0.2"/>
    
    <!-- Center details -->
    <rect x="-30" y="20" width="60" height="8" rx="4" fill="#8B5CF6" opacity="0.3"/>
    <rect x="-30" y="40" width="60" height="8" rx="4" fill="#8B5CF6" opacity="0.3"/>
    
    <!-- Flame effect -->
    <g transform="translate(0, 140)">
      <!-- Orange flame -->
      <ellipse cx="0" cy="0" rx="50" ry="35" fill="#FB923C" opacity="0.9"/>
      <ellipse cx="0" cy="10" rx="40" ry="30" fill="#F97316" opacity="0.8"/>
      <!-- Yellow flame center -->
      <ellipse cx="0" cy="15" rx="25" ry="20" fill="#FCD34D" opacity="0.9"/>
    </g>
  </g>
  
  <!-- StartupHub text -->
  <text 
    x="512" 
    y="680" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" 
    font-size="90" 
    font-weight="700" 
    fill="#FFFFFF" 
    text-anchor="middle"
    letter-spacing="-2">
    StartupHub
  </text>
  
  <!-- Sparkles/stars decoration -->
  <g opacity="0.6">
    <circle cx="200" cy="250" r="8" fill="#FFFFFF"/>
    <circle cx="180" cy="320" r="6" fill="#FFFFFF"/>
    <circle cx="820" cy="280" r="7" fill="#FFFFFF"/>
    <circle cx="850" cy="350" r="5" fill="#FFFFFF"/>
    <circle cx="220" cy="750" r="6" fill="#FFFFFF"/>
    <circle cx="800" cy="720" r="8" fill="#FFFFFF"/>
  </g>
  
  <rect width="1024" height="1024" fill="url(#shine)" rx="180"/>
</svg>
