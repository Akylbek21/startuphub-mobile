<!-- StartupHub Adaptive Icon - 1024x1024 -->
<!-- Safe zone: центральные 768x768px -->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="rocketGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0E7FF;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="shine" cx="30%" cy="30%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Full bleed background -->
  <rect width="1024" height="1024" fill="url(#bgGradient)"/>
  
  <!-- Rocket Icon - centered in safe zone -->
  <g transform="translate(512, 512)">
    <!-- Rocket body -->
    <ellipse cx="0" cy="0" rx="100" ry="180" fill="url(#rocketGradient)"/>
    
    <!-- Rocket tip -->
    <path d="M -65 -180 Q 0 -260 65 -180 Z" fill="#FFFFFF"/>
    
    <!-- Window -->
    <circle cx="0" cy="-50" r="45" fill="#6366F1" opacity="0.3"/>
    <circle cx="0" cy="-50" r="32" fill="#8B5CF6" opacity="0.5"/>
    
    <!-- Left wing -->
    <path d="M -100 80 L -180 180 L -100 150 Z" fill="#E0E7FF"/>
    <path d="M -100 80 L -180 180 L -100 150 Z" fill="#6366F1" opacity="0.2"/>
    
    <!-- Right wing -->
    <path d="M 100 80 L 180 180 L 100 150 Z" fill="#E0E7FF"/>
    <path d="M 100 80 L 180 180 L 100 150 Z" fill="#6366F1" opacity="0.2"/>
    
    <!-- Center details -->
    <rect x="-40" y="30" width="80" height="12" rx="6" fill="#8B5CF6" opacity="0.3"/>
    <rect x="-40" y="55" width="80" height="12" rx="6" fill="#8B5CF6" opacity="0.3"/>
    
    <!-- Flame effect -->
    <g transform="translate(0, 180)">
      <ellipse cx="0" cy="0" rx="65" ry="45" fill="#FB923C" opacity="0.9"/>
      <ellipse cx="0" cy="12" rx="50" ry="38" fill="#F97316" opacity="0.8"/>
      <ellipse cx="0" cy="18" rx="32" ry="25" fill="#FCD34D" opacity="0.9"/>
    </g>
  </g>
  
  <!-- Sparkles in safe zone -->
  <g opacity="0.5">
    <circle cx="280" cy="280" r="10" fill="#FFFFFF"/>
    <circle cx="740" cy="320" r="12" fill="#FFFFFF"/>
    <circle cx="320" cy="720" r="8" fill="#FFFFFF"/>
    <circle cx="700" cy="680" r="10" fill="#FFFFFF"/>
  </g>
  
  <rect width="1024" height="1024" fill="url(#shine)"/>
</svg>
